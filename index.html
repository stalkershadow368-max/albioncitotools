<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10151d">
<title>AlbioncitoTools | Herramientas para Albion Online</title>
<meta name="description" content="Elige una herramienta de crafteo o refinación para Albion Online.">
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#192330;--line:#344456;--text:#edf3f8;--muted:#a8b6c5;--gold:#e8b84b;--green:#62d49a}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px;background:radial-gradient(circle at top,#1c2a3a 0,#10151d 58%);color:var(--text);font:16px/1.5 Arial,Helvetica,sans-serif}
.home{width:min(100%,920px);margin:0 auto}
.banner{display:block;width:100%;height:clamp(150px,28vw,250px);object-fit:cover;object-position:center;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px #0006}
.intro{text-align:center;margin:24px auto 28px}
.brand{margin:0 0 6px;color:var(--gold);font-size:13px;font-weight:800;letter-spacing:2px}
h1{margin:0;font-size:clamp(27px,5vw,40px);line-height:1.15}
.intro p:last-child{margin:10px 0 0;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tool-card{position:relative;display:flex;min-height:150px;align-items:center;gap:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--panel),#151e29);color:var(--text);text-align:left;text-decoration:none;box-shadow:0 10px 28px #0003}
a.tool-card{transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
a.tool-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 32px #0005}
.tool-card:focus-visible{outline:3px solid var(--green);outline-offset:3px}
button.tool-card{width:100%;font:inherit}
.tool-card:disabled{opacity:.68;cursor:not-allowed}
.tool-icon{display:grid;width:52px;height:52px;flex:none;place-items:center;border:1px solid #ffffff1a;border-radius:12px;background:#0e1721;font-size:28px}
.tool-copy{display:grid;gap:5px;min-width:0}
.tool-copy strong{font-size:18px}
.tool-copy small{color:var(--muted);font-size:13px}
.tool-badge{margin-top:5px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tool-arrow{margin-left:auto;color:var(--gold);font-size:25px}
footer{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:700px){body{padding:14px}.tools{grid-template-columns:1fr;gap:10px}.tool-card{min-height:104px;padding:16px}.intro{margin:20px auto}.banner{border-radius:12px}}
@media(prefers-reduced-motion:reduce){a.tool-card{transition:none}}
</style>
</head>
<body>
<main class="home">
  <img class="banner" src="banner-albioncito.jpg" alt="AlbioncitoTools, herramientas para Albion Online">
  <header class="intro">
    <p class="brand">ALBIONCITOTOOLS</p>
    <h1>¿Qué quieres hacer?</h1>
    <p>Elige una herramienta para continuar.</p>
  </header>
  <nav class="tools" aria-label="Herramientas">
    <a class="tool-card" href="crafteo.html">
      <span class="tool-icon" aria-hidden="true">🛠️</span>
      <span class="tool-copy"><strong>Crafteo</strong><small>Consulta recetas de armas, equipo y herramientas</small></span>
      <span class="tool-arrow" aria-hidden="true">→</span>
    </a>
    <button class="tool-card" type="button" disabled>
      <span class="tool-icon" aria-hidden="true">🍲</span>
      <span class="tool-copy"><strong>Crafteo de comida</strong><small>Calculadora de fabricación de comida</small><span class="tool-badge">Próximamente</span></span>
    </button>
    <button class="tool-card" type="button" disabled>
      <span class="tool-icon" aria-hidden="true">🧪</span>
      <span class="tool-copy"><strong>Crafteo de pociones</strong><small>Calculadora de fabricación de pociones</small><span class="tool-badge">Próximamente</span></span>
    </button>
    <a class="tool-card" href="refinacion.html">
      <span class="tool-icon" aria-hidden="true">⚒️</span>
      <span class="tool-copy"><strong>Refinación</strong><small>Calcula materiales, retorno, costos y ganancias</small></span>
      <span class="tool-arrow" aria-hidden="true">→</span>
    </a>
  </nav>
  <footer>Herramientas independientes para Albion Online.</footer>
</main>
</body>
</html>
